<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Lojistik - Rota Çizim Paneli (Admin)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #controls { padding: 10px; background: #333; color: white; }
    #map { height: calc(100vh - 100px); width: 100%; cursor: crosshair; }
    textarea { width: 100%; height: 50px; }
    button { background: #e74c3c; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="controls">
    <b>📍 Yol Çizim Paneli:</b> Harita üzerinde şoförün geçeceği yollara sırayla tıklayın.
    <button onclick="temizle()">Çizimi Sıfırla</button>
  </div>

  <div id="map"></div>

  <div style="padding: 10px;">
    <b>Oluşan Rota Kodu (Bu kodu şoför ekranına yapıştıracağız):</b>
    <textarea id="output" readonly></textarea>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([40.1885, 29.0610], 12); // Bursa Merkez Varsayılan

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© Lojistik Rota Çizici'
    }).addTo(map);

    let points = [];
    let polyline = L.polyline([], {color: 'red', weight: 5}).addTo(map);

    // Haritaya her tıklandığında nokta ekle
    map.on('click', function(e) {
      const lat = parseFloat(e.latlng.lat.toFixed(5));
      const lng = parseFloat(e.latlng.lng.toFixed(5));
      
      points.push([lat, lng]);
      polyline.setLatLngs(points);
      
      // Çizgiyi koda dönüştür
      document.getElementById('output').value = JSON.stringify(points);
    });

    function temizle() {
      points = [];
      polyline.setLatLngs([]);
      document.getElementById('output').value = '';
    }
  </script>
</body>
</html>
